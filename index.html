<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">
    <form action="/login" method="post">

        <h1 style="--i:0">Login</h1>

        <div class="input-box" style="--i:1">
            <input type="text" name="username" placeholder="Username"
                   aria-label="Username" autocomplete="username" required>
            <i class='bx bxs-user' aria-hidden="true"></i>
        </div>

        <div class="input-box" style="--i:2">
            <input type="password" id="password" name="password" placeholder="Password"
                   aria-label="Password" autocomplete="current-password" required>
            <button type="button" class="toggle" aria-label="Show password">
                <i class='bx bx-show' aria-hidden="true"></i>
            </button>
        </div>

        <div class="submit" style="--i:3">
            <button type="submit">Log in</button>
        </div>

    </form>
</div>

<script>
    const form = document.querySelector('form');
    const pw = document.getElementById('password');
    const toggle = document.querySelector('.toggle');
    const submitBtn = document.querySelector('.submit button');

    // Show / hide password
    toggle.addEventListener('click', () => {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        toggle.querySelector('i').className = show ? 'bx bx-hide' : 'bx bx-show';
        toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    // Loading animation demo. Remove preventDefault once this posts to a real backend.
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        submitBtn.classList.add('loading');
        setTimeout(() => submitBtn.classList.remove('loading'), 1800);
    });
</script>

</body>
</html>
